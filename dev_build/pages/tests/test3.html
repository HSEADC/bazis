      <div id="indexForm">
        <h3>Будь в курсе новостей!</h3>
        <form id="my-form" action="https://formspree.io/f/mdkwyjlo" method="POST">
          <input type="email" name="email" />
          <button id="my-form-button" class="A_HeaderLink">Отправить</button>
        </form>
        <h4 id="my-form-status"></h4>
      </div>
      <script>
        var form = document.getElementById("my-form");
      
        async function handleSubmit(event) {
        event.preventDefault();
        var status = document.getElementById("my-form-status");
        var data = new FormData(event.target);
        fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          status.innerHTML = "Спасибо за подписку!";
          form.reset()
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              status.innerHTML = data["errors"].map(error => error["message"]).join(", ")
            } else {
              status.innerHTML = "Ой, возникла какая-то проблема. Попробуйте ещё раз"
            }
          })
        }
      }).catch(error => {
        status.innerHTML = "Ой, возникла какая-то проблема. Попробуйте ещё раз"
      });
    }
    form.addEventListener("submit", handleSubmit)
    </script>
